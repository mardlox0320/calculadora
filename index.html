<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="cu.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora KA</title>
</head>
<body>
    <h1>teste</h1>
    <div class="calculator">
        <input type="text" disabled id="ovo" placeholder="123">
        <div class="box-buttons">
            <button onclick="clean()">C</button>
            <button id="+", onclick="coiso('+')">+</button>
            <button id="-", onclick="coiso('-')">-</button>
            <button id="x", onclick="coiso('*')">*</button>
            <button id="/", onclick="coiso('/')">/</button>
            <button id=">", onclick="remove()">&lt;</button>
            <button id="1", onclick="coiso('1')">1</button>
            <button id="2", onclick="coiso('2')">2</button>
            <button id="3", onclick="coiso('3')">3</button>
            <button id="4", onclick="coiso('4')">4</button>
            <button id="5", onclick="coiso('5')">5</button>
            <button id="6", onclick="coiso('6')">6</button>
            <button id="7", onclick="coiso('7')">7</button>
            <button id="8", onclick="coiso('8')">8</button>
            <button id="9", onclick="coiso('9')">9</button>
            <button id="j" onclick="ovu()">=</button>
            <button id="n", onclick="coiso('0')">0</button> 
            <button id=".", onclick="coiso('.')">.</button>
        </div>
    </div>
 <script src="ladora.js"></script>
</body>
</html>
